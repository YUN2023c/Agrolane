<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDF2EE">
<title>Agrolane 农道 · 农业撮合检索</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div class="brand-text">
        <div class="brand-name">Agrolane</div>
        <div class="brand-sub">农道 · 农业撮合检索</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <button class="nav-item on" data-tab="home">概览</button>
      <button class="nav-item" data-tab="match">撮合检索</button>
      <button class="nav-item" data-tab="entities">主体台账</button>
      <button class="nav-item" data-tab="records">检索记录</button>
    </nav>

    <div class="side-foot">
      <div class="side-label">检索原点</div>
      <div class="coord-row">
        <label>纬度<input id="origin-lat" type="number" step="0.0001" min="-90" max="90" inputmode="decimal"></label>
        <label>经度<input id="origin-lng" type="number" step="0.0001" min="-180" max="180" inputmode="decimal"></label>
      </div>
      <button class="side-apply" id="apply-origin">应用原点</button>
      <div class="side-loc" id="side-loc">—</div>
      <button class="side-link" data-act="open-settings">算法参数</button>
    </div>
  </aside>

  <main class="app" id="app">
    <div class="wrap">
      <section class="page active" id="page-home" data-page="home"></section>
      <section class="page" id="page-match" data-page="match"></section>
      <section class="page" id="page-entities" data-page="entities"></section>
      <section class="page" id="page-records" data-page="records"></section>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip" id="grip"><i></i></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/js/core.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/forms.js"></script>
<script src="/app.js"></script>
</body>
</html>
